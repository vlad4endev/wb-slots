name: Docker Hub Build and Push

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ env.DOCKERHUB_USERNAME }}
        password: ${{ env.DOCKERHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.DOCKERHUB_USERNAME }}/wb-slots
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push to Docker Hub
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          NODE_ENV=production
          NPM_CONFIG_LOGLEVEL=warn
          NPM_CONFIG_PRODUCTION=true

    - name: Update Docker Hub description
      if: github.ref == 'refs/heads/main'
      run: |
        # Update Docker Hub description with README
        curl -X PATCH \
          -H "Authorization: JWT ${{ env.DOCKERHUB_TOKEN }}" \
          -H "Content-Type: application/json" \
          -d '{"full_description": "WB Slots - Automated slot booking system for Wildberries\n\n## Features\n- Automated slot booking\n- Real-time monitoring\n- Telegram notifications\n- Multi-warehouse support\n- User management\n\n## Quick Start\n```bash\ndocker run -d --name wb-slots-app -p 3000:3000 ${{ env.DOCKERHUB_USERNAME }}/wb-slots:latest\n```\n\n## Documentation\n- [GitHub Repository](https://github.com/${{ github.repository }})\n- [Docker Hub](https://hub.docker.com/r/${{ env.DOCKERHUB_USERNAME }}/wb-slots)\n\n## Support\n- [Issues](https://github.com/${{ github.repository }}/issues)\n- [Discussions](https://github.com/${{ github.repository }}/discussions)"}' \
          "https://hub.docker.com/v2/repositories/${{ env.DOCKERHUB_USERNAME }}/wb-slots/"

  notify:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: always()

    steps:
    - name: Notify on success
      if: needs.build-and-push.result == 'success'
      run: |
        echo "✅ Successfully pushed to Docker Hub!"
        echo "Image: ${{ env.DOCKERHUB_USERNAME }}/wb-slots:${{ github.sha }}"
        echo "Docker Hub: https://hub.docker.com/r/${{ env.DOCKERHUB_USERNAME }}/wb-slots"

    - name: Notify on failure
      if: needs.build-and-push.result == 'failure'
      run: |
        echo "❌ Failed to push to Docker Hub!"
        exit 1
