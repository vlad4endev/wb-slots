services: 
  postgres: 
    image: postgres:15-alpine 
    container_name: wb-slots-postgres-dev 
    environment: 
      POSTGRES_DB: wb_slots 
      POSTGRES_USER: postgres 
      POSTGRES_PASSWORD: password 
    ports: 
      - "5432:5432" 
    volumes: 
      - postgres_data:/var/lib/postgresql/data 
    healthcheck: 
      test: ["CMD-SHELL", "pg_isready -U postgres"] 
      interval: 10s 
      timeout: 5s 
      retries: 5 
 
  redis: 
    image: redis:7-alpine 
    container_name: wb-slots-redis-dev 
    ports: 
      - "6379:6379" 
    volumes: 
      - redis_data:/data 
    healthcheck: 
      test: ["CMD", "redis-cli", "ping"] 
      interval: 10s 
      timeout: 5s 
      retries: 5 
 
volumes: 
  postgres_data: 
  redis_data: 
